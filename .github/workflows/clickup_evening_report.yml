name: ClickUp Evening Report

on:
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Set today's date
        run: |
          echo "TODAY=$(date -u '+%Y-%m-%d')" >> $GITHUB_ENV
          # ISO week (%G-W%V), so the memory rolls over on Monday and a run
          # late on Sunday cannot bleed into the next week's history.
          echo "WEEK=$(date -u '+%G-W%V')" >> $GITHUB_ENV

      # The morning plan is OPTIONAL. fail-on-cache-miss used to be true, which
      # killed this job before Python even started whenever the morning report
      # had not run — or had run and sent nothing. The evening report's real
      # job is "what time was logged today", which ClickUp answers on its own,
      # so a missing snapshot now only costs the planned/unplanned split.
      - name: Restore morning snapshot (optional)
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: scripts/clickup_dailymail/morning_snapshot.json
          key: morning-snapshot-${{ env.TODAY }}
          fail-on-cache-miss: false

      # Week-to-date memory: which tasks have already been unplanned earlier
      # this week. Restored by PREFIX, because cache keys are immutable — each
      # run saves under its own unique key and this picks the newest match from
      # the same ISO week. A miss is fine: the report just loses the "Nth time
      # this week" badges for one run.
      - name: Restore week memory (optional)
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: scripts/clickup_dailymail/week_memory.json
          key: week-memory-${{ env.WEEK }}-${{ env.TODAY }}
          restore-keys: |
            week-memory-${{ env.WEEK }}-
          fail-on-cache-miss: false

      - name: Run evening report
        working-directory: scripts/clickup_dailymail
        env:
          CLICKUP_TOKEN:      ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_WORKSPACE:  ${{ secrets.CLICKUP_WORKSPACE }}
          EMAIL_FROM:         ${{ secrets.GMAIL_ADDRESS }}
          EMAIL_PASSWORD:     ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.CLICKUP_MAIL_RECIPIENTS }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
        run: python main_evening.py

      # run_id keeps the key unique — saving to an existing key is a no-op in
      # the Actions cache, which would silently freeze the memory on day one.
      - name: Save week memory
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: scripts/clickup_dailymail/week_memory.json
          key: week-memory-${{ env.WEEK }}-${{ env.TODAY }}-${{ github.run_id }}
