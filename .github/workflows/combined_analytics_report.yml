name: Combined Website & Brochure Analytics

on:
  workflow_dispatch:

jobs:
  send-combined-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cryptography

      - name: Run combined report
        env:
          CLARITY_TOKEN:            ${{ secrets.CLARITY_TOKEN }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          EMAIL_FROM:               ${{ secrets.COMBINED_REPORT_EMAIL_FROM }}
          EMAIL_PASSWORD:           ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:                 ${{ secrets.COMBINED_REPORT_EMAIL_TO }}
        run: python scripts/combined_analytics_report/combined_report.py
