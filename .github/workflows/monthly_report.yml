name: Monthly ClickUp Ops Report

on:
  workflow_dispatch:
    inputs:
      report_month:
        description: 'Month to report on, as YYYY-MM (leave blank for last month)'
        required: false
        default: ''
  # NO schedule block on purpose. This report is triggered externally by
  # cron-job.org calling the GitHub API, exactly like the weekly report.
  # Adding a `schedule:` here as well would fire the workflow twice and send
  # the same email twice.

jobs:
  send-monthly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monthly report
        working-directory: scripts/monthly_report
        env:
          CLICKUP_TOKEN:      ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_WORKSPACE:  ${{ secrets.CLICKUP_WORKSPACE }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.MONTHLY_REPORT_RECIPIENTS }}
          REPORT_MONTH:       ${{ github.event.inputs.report_month }}
        run: python monthly_report.py
