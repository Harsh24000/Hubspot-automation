name: Monthly ClickUp Ops Report

on:
  workflow_dispatch:
    inputs:
      report_month:
        description: 'Month to report on, as YYYY-MM (leave blank for last month)'
        required: false
        default: ''
  schedule:
    # 03:30 UTC on the 1st of every month = 09:00 IST.
    # Reports the calendar month that just ended (1 Sep -> August).
    - cron: '30 3 1 * *'

jobs:
  send-monthly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monthly report
        working-directory: scripts/monthly_report
        env:
          CLICKUP_TOKEN:      ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_WORKSPACE:  ${{ secrets.CLICKUP_WORKSPACE }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.MONTHLY_REPORT_RECIPIENTS }}
          REPORT_MONTH:       ${{ github.event.inputs.report_month }}
        run: python monthly_report.py
