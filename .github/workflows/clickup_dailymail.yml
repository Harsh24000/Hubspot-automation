name: ClickUp Daily Updates Mail

on:
  workflow_dispatch:

jobs:
  send-standup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Set today's date
        run: echo "TODAY=$(date -u '+%Y-%m-%d')" >> $GITHUB_ENV

      - name: Run standup mailer
        working-directory: scripts/clickup_dailymail
        env:
          CLICKUP_TOKEN:      ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_WORKSPACE:  ${{ secrets.CLICKUP_WORKSPACE }}
          EMAIL_FROM:         ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.CLICKUP_MAIL_RECIPIENTS }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Cache morning snapshot for evening script
        uses: actions/cache/save@v4
        with:
          path: scripts/clickup_dailymail/morning_snapshot.json
          key: morning-snapshot-${{ env.TODAY }}
